{% extends "base.html" %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold text-center mb-12">Manage Products</h1>
        
        <div class="mb-8">
            <a href="{{ url_for('add_product') }}" class="bg-primary text-white px-6 py-3 rounded-full hover:bg-opacity-80 transition-all duration-300 transform hover:scale-105">Add New Product</a>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            {% for product in products %}
            <div class="bg-gray-50 p-4 rounded-lg">
                <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-full h-32 object-cover rounded mb-4">
                <h3 class="font-semibold">{{ product.name }}</h3>
                <p class="text-primary">${{ "%.2f"|format(product.price) }}</p>
                <div class="mt-4 space-x-2">
                    <a href="{{ url_for('edit_product', id=product.id) }}" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">Edit</a>
                    <form action="{{ url_for('delete_product', id=product.id) }}" method="post" class="inline">
                        <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="mt-12">
            <h2 class="text-2xl font-bold mb-4">Add Category</h2>
            <form action="{{ url_for('add_category') }}" method="post" class="flex space-x-4">
                <input type="text" name="name" placeholder="Category Name" required class="flex-1 border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary">
                <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:bg-opacity-80">Add Category</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
