{% extends "admin/admin_base.html" %}

{% block title %}Edit Product: {{ product.name }}{% endblock %}

{% block admin_content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8 flex items-center space-x-4">
        <a href="{{ url_for('admin_products') }}?key=velora2026"
            class="w-10 h-10 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h3 class="text-2xl font-bold text-gray-900">Edit Product</h3>
            <p class="text-sm text-gray-500 font-medium">Update the details for {{ product.name }}.</p>
        </div>
    </div>

    <form action="{{ url_for('edit_product', id=product.id) }}?key=velora2026" method="POST"
        enctype="multipart/form-data" class="space-y-6">
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="name" class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Product
                        Name</label>
                    <input type="text" id="name" name="name" value="{{ product.name }}" required
                        class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium">
                </div>
                <div class="space-y-2">
                    <label for="category"
                        class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Category</label>
                    <select id="category" name="category" required
                        class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium text-gray-600">
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id==product.category_id %}selected{% endif %}>
                            {{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="space-y-2">
                <label for="description"
                    class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Description</label>
                <textarea id="description" name="description" rows="5" required
                    class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium resize-none">{{ product.description }}</textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="price" class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Price
                        ($)</label>
                    <input type="number" step="0.01" id="price" name="price" value="{{ product.price }}" required
                        class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium">
                </div>
                <div class="space-y-2">
                    <label for="stock" class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Stock
                        Quantity</label>
                    <input type="number" id="stock" name="stock" value="{{ product.stock_quantity }}" required
                        class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium">
                </div>
            </div>

            <div class="space-y-2">
                <label for="image" class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Change
                    Image</label>
                <div class="relative group">
                    <input type="file" id="image" name="image" class="hidden" accept="image/*"
                        onchange="previewImage(this)">
                    <label for="image"
                        class="flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-3xl p-10 cursor-pointer hover:border-secondary transition-colors bg-dashboard/50">
                        <div id="preview-placeholder" class="text-center {% if product.image_url %}hidden{% endif %}">
                            <div
                                class="w-16 h-16 bg-white rounded-2xl shadow-sm mx-auto flex items-center justify-center text-secondary mb-4">
                                <i class="fas fa-image text-2xl"></i>
                            </div>
                            <p class="text-sm font-bold text-gray-700">Click to upload new image</p>
                        </div>
                        <img id="image-preview" src="{{ product.image_url }}" alt="Preview"
                            class="{% if not product.image_url %}hidden{% endif %} max-h-48 rounded-2xl shadow-md border border-white">
                        <p class="text-[10px] text-gray-400 mt-4">Current image: {{ product.image_url }}
                        </p>
                    </label>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end space-x-4">
            <a href="{{ url_for('admin_products') }}?key=velora2026"
                class="px-8 py-4 text-sm font-bold text-gray-500 hover:text-primary transition-colors">Discard
                Changes</a>
            <button type="submit"
                class="px-10 py-4 bg-primary text-white rounded-2xl font-bold hover:bg-opacity-90 transition-all shadow-xl shadow-primary/20">Save
                Product</button>
        </div>
    </form>
</div>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('image-preview').classList.remove('hidden');
                document.getElementById('preview-placeholder').classList.add('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
