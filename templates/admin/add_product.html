{% extends "admin/admin_base.html" %}

{% block title %}Add New Product{% endblock %}

{% block admin_content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8 flex items-center space-x-4">
        <a href="{{ url_for('admin_products') }}?key=velora2026"
            class="w-10 h-10 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-center text-gray-500 hover:text-primary transition-colors">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h3 class="text-2xl font-bold text-gray-900">Create Product</h3>
            <p class="text-sm text-gray-500 font-medium">Fill in the details to add a new item to your store.</p>
        </div>
    </div>

    <form action="{{ url_for('add_product') }}?key=velora2026" method="POST" enctype="multipart/form-data"
        class="space-y-6">
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="name" class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Product
                        Name</label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Elegant Silk Dress"
                        class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium">
                </div>
                <div class="space-y-2">
                    <label for="category"
                        class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Category</label>
                    <select id="category" name="category" required
                        class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium text-gray-600">
                        {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="space-y-2">
                <label for="description"
                    class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Description</label>
                <textarea id="description" name="description" rows="5" required
                    placeholder="Describe the product features, materials, and fit..."
                    class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium resize-none"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="price" class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Price
                        ($)</label>
                    <input type="number" step="0.01" id="price" name="price" required placeholder="0.00"
                        class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium">
                </div>
                <div class="space-y-2">
                    <label for="stock" class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Initial
                        Stock</label>
                    <input type="number" id="stock" name="stock" required value="0"
                        class="w-full px-5 py-3.5 bg-dashboard rounded-2xl border-none focus:ring-2 focus:ring-secondary text-sm font-medium">
                </div>
            </div>

            <div class="space-y-2">
                <label for="image" class="text-xs font-bold text-gray-400 uppercase tracking-wider pl-1">Product
                    Image</label>
                <div class="relative group">
                    <input type="file" id="image" name="image" class="hidden" accept="image/*"
                        onchange="previewImage(this)">
                    <label for="image"
                        class="flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-3xl p-10 cursor-pointer hover:border-secondary transition-colors bg-dashboard/50">
                        <div id="preview-placeholder" class="text-center">
                            <div
                                class="w-16 h-16 bg-white rounded-2xl shadow-sm mx-auto flex items-center justify-center text-secondary mb-4">
                                <i class="fas fa-image text-2xl"></i>
                            </div>
                            <p class="text-sm font-bold text-gray-700">Click to upload image</p>
                            <p class="text-[10px] text-gray-400 mt-1">Supports JPG, PNG, WEBP (Max 5MB)</p>
                        </div>
                        <img id="image-preview" src="#" alt="Preview"
                            class="hidden max-h-48 rounded-2xl shadow-md border border-white">
                    </label>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end space-x-4">
            <a href="{{ url_for('admin_products') }}?key=velora2026"
                class="px-8 py-4 text-sm font-bold text-gray-500 hover:text-primary transition-colors">Cancel</a>
            <button type="submit"
                class="px-10 py-4 bg-primary text-white rounded-2xl font-bold hover:bg-opacity-90 transition-all shadow-xl shadow-primary/20">Publish
                Product</button>
        </div>
    </form>
</div>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('image-preview').classList.remove('hidden');
                document.getElementById('preview-placeholder').classList.add('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
