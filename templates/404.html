<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Velora Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="fixed top-0 w-full bg-black shadow-lg z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-white">VELORA <span class="text-yellow-400">Store</span></a>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-16 min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="text-9xl font-bold text-gray-300 mb-4">404</div>
            <h1 class="text-4xl font-bold text-gray-800 mb-4">Page Not Found</h1>
            <p class="text-xl text-gray-600 mb-8">The page you're looking for doesn't exist or has been moved.</p>
            <a href="/" class="bg-black text-white px-8 py-3 rounded-full hover:bg-gray-800 transition-all duration-300 transform hover:scale-105">Go Home</a>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p>&copy; 2026 Velora Store. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
