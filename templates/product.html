{% extends "base.html" %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-full h-96 object-cover rounded-lg shadow-lg">
            </div>
            <div>
                <h1 class="text-4xl font-bold mb-4">{{ product.name }}</h1>
                <p class="text-2xl text-primary font-bold mb-4">${{ "%.2f"|format(product.price) }}</p>
                <p class="text-gray-600 mb-8">{{ product.description }}</p>
                <button onclick="addToCart({{ product.id }})" class="bg-primary text-white px-8 py-3 rounded-full hover:bg-opacity-80 transition-all duration-300 transform hover:scale-105">Add to Cart</button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
