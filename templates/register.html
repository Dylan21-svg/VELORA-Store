{% extends "base.html" %}

{% block content %}
<section class="py-16 md:py-24 bg-gray-50/50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto px-4 sm:px-6">
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-gray-100 animate-fade-in-up">
            <div class="text-center mb-6">
                <span class="text-[10px] font-black uppercase tracking-[0.25em] text-[var(--dynamic-color)]">Velora Privilège</span>
                <h1 class="text-3xl font-black text-gray-900 tracking-tight mt-1">Create Account</h1>
                <p class="text-xs text-gray-400 font-medium mt-1">Join the circle for complimentary shipping & 200 welcome reward points</p>
            </div>

            <!-- Error Banner -->
            {% if error %}
            <div id="register-error-alert" class="mb-5 p-4 bg-red-50 border border-red-200 text-red-700 rounded-2xl flex items-start space-x-3 text-xs font-bold animate-shake">
                <i class="fas fa-exclamation-circle text-red-500 text-base shrink-0 mt-0.5"></i>
                <div class="flex-1">{{ error }}</div>
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-700 text-xs">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            {% endif %}

            <!-- Social Sign Up -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button type="button" onclick="handleSocialAuth('google')"
                    class="flex items-center justify-center space-x-2 py-3 px-4 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-xl text-xs font-bold text-gray-700 transition-all cursor-pointer">
                    <i class="fab fa-google text-red-500"></i>
                    <span>Google</span>
                </button>
                <button type="button" onclick="handleSocialAuth('apple')"
                    class="flex items-center justify-center space-x-2 py-3 px-4 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-xl text-xs font-bold text-gray-700 transition-all cursor-pointer">
                    <i class="fab fa-apple text-black"></i>
                    <span>Apple ID</span>
                </button>
            </div>

            <div class="relative flex items-center justify-center mb-6">
                <div class="border-t border-gray-200 w-full"></div>
                <span class="bg-white px-3 text-[10px] uppercase font-black tracking-widest text-gray-400 absolute">Or register manually</span>
            </div>
            
            <form id="register-form" action="{{ url_for('register') }}" method="POST" class="space-y-4" onsubmit="return validateRegisterForm(event)">
                <div>
                    <label for="username" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-1.5">Desired Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-user text-xs"></i>
                        </span>
                        <input type="text" id="username" name="username" required
                            value="{{ username_val if username_val else '' }}"
                            placeholder="e.g. sophia_vance"
                            class="w-full bg-gray-50 border-2 border-transparent focus:border-[var(--dynamic-color)] focus:bg-white rounded-2xl pl-10 pr-4 py-3.5 text-xs font-bold transition-all outline-none text-gray-900">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-1.5">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-envelope text-xs"></i>
                        </span>
                        <input type="email" id="email" name="email" required
                            value="{{ email_val if email_val else '' }}"
                            placeholder="sophia@example.com"
                            class="w-full bg-gray-50 border-2 border-transparent focus:border-[var(--dynamic-color)] focus:bg-white rounded-2xl pl-10 pr-4 py-3.5 text-xs font-bold transition-all outline-none text-gray-900">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-1.5">Password (Min. 6 chars)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••"
                            class="w-full bg-gray-50 border-2 border-transparent focus:border-[var(--dynamic-color)] focus:bg-white rounded-2xl pl-10 pr-11 py-3.5 text-xs font-bold transition-all outline-none text-gray-900">
                        <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-700 cursor-pointer">
                            <i class="fas fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-1.5">Confirm Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-shield-alt text-xs"></i>
                        </span>
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="6" placeholder="••••••••"
                            class="w-full bg-gray-50 border-2 border-transparent focus:border-[var(--dynamic-color)] focus:bg-white rounded-2xl pl-10 pr-11 py-3.5 text-xs font-bold transition-all outline-none text-gray-900">
                        <button type="button" onclick="togglePasswordVisibility('confirm_password', this)" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-700 cursor-pointer">
                            <i class="fas fa-eye text-xs"></i>
                        </button>
                    </div>
                    <p id="password-match-error" class="hidden text-[11px] font-bold text-red-500 mt-1">Passwords do not match.</p>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                        class="w-full py-4 bg-black text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-[var(--dynamic-color)] transition-all transform hover:scale-[1.01] shadow-xl hover:shadow-[var(--dynamic-color)]/25 cursor-pointer">
                        Create VIP Account
                    </button>
                </div>
            </form>
            
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-xs font-medium text-gray-500">
                    Already have an account? 
                    <a href="{{ url_for('login') }}" class="font-black text-gray-900 hover:text-[var(--dynamic-color)] transition-colors">
                        Sign In
                    </a>
                </p>
            </div>
        </div>
    </div>
</section>

<script>
function togglePasswordVisibility(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

function validateRegisterForm(e) {
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('confirm_password').value;
    const errorEl = document.getElementById('password-match-error');
    if (p1 !== p2) {
        if (errorEl) errorEl.classList.remove('hidden');
        e.preventDefault();
        return false;
    }
    if (errorEl) errorEl.classList.add('hidden');
    return true;
}

function handleSocialAuth(provider) {
    fetch('/api/social-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            window.location.href = data.redirect || '/';
        }
    })
    .catch(() => {
        window.location.href = '/login';
    });
}
</script>
{% endblock %}
