{% extends "base.html" %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold text-center mb-12">Contact Us</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <div>
                <h2 class="text-2xl font-semibold mb-6">Get in Touch</h2>
                <div class="space-y-4">
                    <div class="flex items-center">
                        <i class="fas fa-map-marker-alt text-primary text-xl mr-4"></i>
                        <div>
                            <h3 class="font-semibold">Address</h3>
                            <p class="text-gray-600">123 Fashion Street, Style City, SC 12345</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-phone text-primary text-xl mr-4"></i>
                        <div>
                            <h3 class="font-semibold">Phone</h3>
                            <p class="text-gray-600">(555) 123-4567</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-envelope text-primary text-xl mr-4"></i>
                        <div>
                            <h3 class="font-semibold">Email</h3>
                            <p class="text-gray-600">info@velorastore.com</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-clock text-primary text-xl mr-4"></i>
                        <div>
                            <h3 class="font-semibold">Business Hours</h3>
                            <p class="text-gray-600">Mon-Fri: 9AM-6PM<br>Sat-Sun: 10AM-4PM</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div>
                <h2 class="text-2xl font-semibold mb-6">Send us a Message</h2>
                <form class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                        <input type="text" id="name" name="name" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" name="email" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
                        <input type="text" id="subject" name="subject" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
                        <textarea id="message" name="message" rows="4" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-primary text-white py-3 rounded-full hover:bg-opacity-80 transition-all duration-300 transform hover:scale-105">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
