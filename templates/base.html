<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="fixed top-0 w-full shadow-lg z-50 transition-colors duration-1000" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{{ url_for('index') }}" class="text-2xl font-bold" id="logo"><span class="text-white">VELORA</span> <span class="text-yellow-400">Store</span></a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="{{ url_for('index') }}" class="text-white hover:text-gray-200 transition-colors">Home</a>
                    <a href="{{ url_for('shop') }}" class="text-white hover:text-gray-200 transition-colors">Shop</a>
                    <a href="{{ url_for('features') }}" class="text-white hover:text-gray-200 transition-colors">Features</a>
                    <a href="{{ url_for('about') }}" class="text-white hover:text-gray-200 transition-colors">About</a>
                    <a href="{{ url_for('contact') }}" class="text-white hover:text-gray-200 transition-colors">Contact</a>
                    <a href="{{ url_for('help') }}" class="text-white hover:text-gray-200 transition-colors">Help & FAQ</a>
                    <form action="{{ url_for('search') }}" method="get" class="flex items-center">
                        <input type="text" name="q" placeholder="Search products..." class="px-3 py-1 text-black rounded-l">
                        <button type="submit" class="bg-yellow-400 text-black px-3 py-1 rounded-r hover:bg-yellow-500">Search</button>
                    </form>
                </div>
                <div class="flex items-center space-x-4">
                    {% if current_user.is_authenticated %}
                        <a href="{{ url_for('cart') }}" class="text-white hover:text-gray-200 transition-colors relative">
                            <i class="fas fa-shopping-cart text-xl"></i>
                            <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                        </a>
                        <a href="{{ url_for('wishlist') }}" class="text-white hover:text-gray-200 transition-colors">
                            <i class="fas fa-heart text-xl"></i>
                        </a>
                        {% if current_user.is_admin %}
                            <a href="{{ url_for('admin_dashboard') }}?key=velora2026" class="text-white hover:text-gray-200 transition-colors">Admin</a>
                        {% endif %}
                        <a href="{{ url_for('logout') }}" class="text-white hover:text-gray-200 transition-colors">Logout</a>
                    {% else %}
                        <a href="{{ url_for('login') }}" class="text-white hover:text-gray-200 transition-colors">Login</a>
                        <a href="{{ url_for('register') }}" class="text-white hover:text-gray-200 transition-colors">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-16">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p>&copy; 2026 Velora Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
</body>
</html>
