{% extends "base.html" %}

{% block content %}
<section class="py-16 md:py-24 bg-gray-50/50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto px-4 sm:px-6">
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-gray-100 animate-fade-in-up">
            <div class="text-center mb-8">
                <span class="text-[10px] font-black uppercase tracking-[0.25em] text-[var(--dynamic-color)]">Velora Member</span>
                <h1 class="text-3xl font-black text-gray-900 tracking-tight mt-1">Welcome Back</h1>
                <p class="text-xs text-gray-400 font-medium mt-1">Sign in to access your orders and wishlist</p>
            </div>
            
            <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-2">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter username"
                        class="w-full bg-gray-50 border-2 border-transparent focus:border-[var(--dynamic-color)] focus:bg-white rounded-2xl px-5 py-3.5 text-xs font-bold transition-all outline-none text-gray-900">
                </div>
                <div>
                    <label for="password" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-2">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="w-full bg-gray-50 border-2 border-transparent focus:border-[var(--dynamic-color)] focus:bg-white rounded-2xl px-5 py-3.5 text-xs font-bold transition-all outline-none text-gray-900">
                </div>
                <button type="submit" 
                    class="w-full py-4 bg-black text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-[var(--dynamic-color)] transition-all transform hover:scale-102 shadow-xl hover:shadow-[var(--dynamic-color)]/25 cursor-pointer">
                    Sign In
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-xs font-medium text-gray-500">
                    Don't have an account? 
                    <a href="{{ url_for('register') }}" class="font-black text-gray-900 hover:text-[var(--dynamic-color)] transition-colors">
                        Create Account
                    </a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
