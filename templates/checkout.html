{% extends "base.html" %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold text-center mb-12">Checkout</h1>

        <form action="{{ url_for('checkout') }}" method="post" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="name" name="name" required
                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required
                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary">
            </div>
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
                <textarea id="address" name="address" rows="3" required
                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary"></textarea>
            </div>
            <!-- Payment Method Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Payment Method</label>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 p-3 border rounded-md cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="payment_method" value="paypal"
                            class="focus:ring-primary h-4 w-4 text-primary border-gray-300" checked
                            onchange="togglePhoneInput()">
                        <span class="text-gray-900 font-medium">PayPal</span>
                        <i class="fab fa-paypal text-blue-600 text-xl ml-auto"></i>
                    </label>
                    <label class="flex items-center space-x-3 p-3 border rounded-md cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="payment_method" value="mtn"
                            class="focus:ring-primary h-4 w-4 text-primary border-gray-300"
                            onchange="togglePhoneInput()">
                        <span class="text-gray-900 font-medium">MTN Mobile Money</span>
                        <span class="ml-auto font-bold text-yellow-500">MoMo</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 border rounded-md cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="payment_method" value="orange"
                            class="focus:ring-primary h-4 w-4 text-primary border-gray-300"
                            onchange="togglePhoneInput()">
                        <span class="text-gray-900 font-medium">Orange Money</span>
                        <span class="ml-auto font-bold text-orange-500">OM</span>
                    </label>
                </div>
            </div>

            <!-- Conditional Phone Input -->
            <div id="phone-container" class="hidden">
                <label for="phone_number" class="block text-sm font-medium text-gray-700">Phone Number (Required for
                    Mobile Money)</label>
                <input type="tel" id="phone_number" name="phone_number" placeholder="e.g., 670000000"
                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary">
            </div>

            <script>
                function togglePhoneInput() {
                    const method = document.querySelector('input[name="payment_method"]:checked').value;
                    const phoneContainer = document.getElementById('phone-container');
                    const phoneInput = document.getElementById('phone_number');

                    if (method === 'mtn' || method === 'orange') {
                        phoneContainer.classList.remove('hidden');
                        phoneInput.setAttribute('required', 'required');
                    } else {
                        phoneContainer.classList.add('hidden');
                        phoneInput.removeAttribute('required');
                    }
                }
            </script>

            <div class="bg-gray-50 p-4 rounded-lg">
                <h3 class="text-lg font-semibold mb-4">Order Summary</h3>
                {% for item in products %}
                <div class="flex justify-between mb-2">
                    <span>{{ item.product.name }} x{{ item.quantity }}</span>
                    <span>${{ "%.2f"|format(item.product.price * item.quantity) }}</span>
                </div>
                {% endfor %}
                <div class="border-t pt-2 mt-2">
                    <div class="flex justify-between font-bold">
                        <span>Total</span>
                        <span>${{ "%.2f"|format(total) }}</span>
                    </div>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-primary text-white py-3 rounded-full hover:bg-opacity-80 transition-all duration-300 transform hover:scale-105">Place
                Order</button>
        </form>
    </div>
</section>
{% endblock %}
