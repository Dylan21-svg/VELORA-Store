<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#2b6cb0" />
    </marker>
    <style>
      .box { fill:#f7fafc; stroke:#2b6cb0; stroke-width:2; rx:8; }
      .ext { fill:#fff7ed; stroke:#dd6b20; }
      .lbl { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#1a202c; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#2b6cb0; }
      .sub { font-size:12px; fill:#4a5568; }
      .arrow { stroke:#2b6cb0; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .dashed { stroke-dasharray:6 4; }
    </style>
  </defs>

  <text x="20" y="30" class="title">VELORA Store — System Architecture</text>

  <!-- Browser / Frontend -->
  <rect x="40" y="70" width="240" height="110" class="box" />
  <text x="60" y="95" class="lbl">User Browser</text>
  <text x="60" y="115" class="sub">HTML / CSS / JS (templates & static)</text>

  <!-- Flask Backend -->
  <rect x="330" y="50" width="340" height="150" class="box" />
  <text x="350" y="80" class="lbl">Flask Backend</text>
  <text x="350" y="100" class="sub">app.py · routes (auth, main, admin)</text>
  <text x="350" y="120" class="sub">Business logic, request handling</text>

  <!-- SQLAlchemy -->
  <rect x="360" y="230" width="220" height="70" class="box" />
  <text x="380" y="255" class="lbl">SQLAlchemy ORM</text>
  <text x="380" y="275" class="sub">Models, queries, transactions</text>

  <!-- PostgreSQL -->
  <rect x="650" y="230" width="260" height="100" class="box" />
  <text x="670" y="260" class="lbl">PostgreSQL</text>
  <text x="670" y="280" class="sub">Persistent data: users, products, orders</text>

  <!-- External Payment -->
  <rect x="700" y="50" width="240" height="70" class="ext" />
  <text x="720" y="80" class="lbl">Payment Gateway (external)</text>

  <!-- External Email -->
  <rect x="700" y="140" width="240" height="70" class="ext" />
  <text x="720" y="170" class="lbl">Email Service (SMTP / API)</text>

  <!-- Arrows -->
  <path d="M280 125 L330 125" class="arrow" />
  <path d="M510 200 L440 230" class="arrow" />
  <path d="M460 265 L650 265" class="arrow" />
  <path d="M670 200 L700 100" class="arrow dashed" stroke="#4a5568" marker-end="url(#arrow)" />
  <path d="M670 200 L700 170" class="arrow dashed" stroke="#4a5568" marker-end="url(#arrow)" />

  <!-- Labels on connections -->
  <text x="300" y="110" class="sub">HTTP / HTTPS</text>
  <text x="520" y="235" class="sub">ORM calls / Transactions</text>
  <text x="520" y="285" class="sub">SQL (parameterized)</text>
  <text x="760" y="95" class="sub">Payment API</text>
  <text x="760" y="185" class="sub">Email API / SMTP</text>

  <!-- Legend -->
  <rect x="40" y="360" width="18" height="12" fill="#f7fafc" stroke="#2b6cb0" />
  <text x="70" y="370" class="sub">Internal component (app / infra)</text>
  <rect x="40" y="390" width="18" height="12" fill="#fff7ed" stroke="#dd6b20" />
  <text x="70" y="400" class="sub">External service</text>

  <!-- Footer note -->
  <text x="20" y="500" class="sub">Diagram: Frontend → Flask Backend → SQLAlchemy → PostgreSQL. Backend integrates with external Payment and Email services.</text>
</svg>